<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Режимы — Ananda AI</title>
  <style>
    body {
      background:#0e0e11;
      color:#eaeaf0;
      font-family:system-ui,sans-serif;
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .container {
      max-width:600px;
      padding:40px;
      text-align:center;
    }
    h1 {
      font-weight:300;
      letter-spacing:0.15em;
      margin-bottom:40px;
    }
    .mode {
      margin-bottom:30px;
      opacity:0.8;
    }
    .back {
      margin-top:50px;
      font-size:14px;
      opacity:0.5;
    }
    @keyframes breathe {
      0% {opacity:0.4;}
      50% {opacity:0.8;}
      100% {opacity:0.4;}
    }
    .breathing {
      animation:breathe 6s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ananda AI</h1>

    <div class="mode">
      <strong>Heart</strong><br>
      Мягкий диалог. Присутствие. Принятие.
    </div>

    <div class="mode">
      <strong>
        <a href="/silence/" style="color:#eaeaf0;text-decoration:none;">
          Silence
        </a>
      </strong><br>
      Короткие ответы. Паузы. Тишина.
    </div>

    <div class="mode">
      <strong>Guide</strong><br>
      Прояснение. Направление. Честность.
    </div>

    <div class="back">
      <a href="/dialog/" class="breathing" style="color:#eaeaf0;text-decoration:none;">
        ← Войти в диалог
      </a>
    </div>
  </div>
</body>
</html>
