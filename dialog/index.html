<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="ananda-api-base" content="">
<title>Ananda AI — Диалог</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">

<style>
body {
  color: #eaeaf0;
  font-family: system-ui, sans-serif;
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 2s ease;
}

/* 🌗 ДЕНЬ — статичный фон */
body.day {
  background: radial-gradient(circle at top, #12131a, #0e0e11);
}

/* 🌙 НОЧЬ — дышащий фон */
body.night {
  background: radial-gradient(
    ellipse at center,
    #15111c 0%,
    #0e0e11 70%
  );
  animation: nightBreath 18s ease-in-out infinite;
}

@keyframes nightBreath {
  0% {
    background-position: 50% 50%;
    filter: brightness(0.95);
  }
  50% {
    background-position: 52% 48%;
    filter: brightness(1.02);
  }
  100% {
    background-position: 50% 50%;
    filter: brightness(0.95);
  }
}

/* 🍃 ВРЕМЕНА ГОДА */
body.spring { --accent: #b8ffd9; }
body.summer { --accent: #fff3b8; }
body.autumn { --accent: #ffc2a1; }
body.winter { --accent: #c7d9ff; }

/* 🌸 ЛОТОС-ФОН */
#lotus-bg {
  position: fixed;
  inset: 0;
  background-image: url("/favicon.ico");
  background-repeat: no-repeat;
  background-position: center;
  background-size: 260px 260px;

  opacity: 0.06;
  filter: blur(0.5px);

  pointer-events: none;
  z-index: 0;

  animation: lotusBreath 9s ease-in-out infinite;
}

/* Ночью лотос дышит медленнее */
body.night #lotus-bg {
  animation: lotusBreath 12s ease-in-out infinite;
  opacity: 0.04;
}

/* 🌬 ДЫХАНИЕ ЛОТОСА */
@keyframes lotusBreath {
  0% {
    transform: scale(0.96);
    opacity: 0.04;
  }
  50% {
    transform: scale(1);
    opacity: 0.075;
  }
  100% {
    transform: scale(0.96);
    opacity: 0.04;
  }
}

/* Реакция лотоса на режим */
body.mode-heart #lotus-bg {
  filter: blur(0.5px) hue-rotate(0deg);
}

body.mode-silence #lotus-bg {
  filter: blur(1px) hue-rotate(200deg);
  opacity: 0.03;
}

body.mode-guide #lotus-bg {
  filter: blur(0.5px) hue-rotate(40deg);
  opacity: 0.07;
}

/* 📦 Контент поверх */
.container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 600px;
  padding: 40px;
  text-align: center;
}

h1 {
  font-weight: 300;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
}

p {
  opacity: 0.7;
  margin-bottom: 20px;
}

#chat {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 20px 0;
  max-height: 60vh;
  overflow-y: auto;
  padding-right: 4px;
}

#chat::-webkit-scrollbar {
  width: 6px;
}

#chat::-webkit-scrollbar-track {
  background: rgba(255,255,255,0.05);
  border-radius: 3px;
}

#chat::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
}

.message {
  padding: 10px 14px;
  border-radius: 10px;
  line-height: 1.5;
  white-space: pre-line;
  max-width: 85%;
}

.message.user {
  align-self: flex-end;
  background: rgba(255,255,255,0.06);
  color: #ffffff;
}

.message.ai {
  align-self: flex-start;
  background: rgba(180,199,255,0.08);
  color: var(--accent, #b8c7ff);
}

.fade {
  opacity: 0;
  transition: opacity 0.6s ease;
}
.fade.show { opacity: 1; }

/* дыхание ввода */
textarea {
  width: 100%;
  min-height: 120px;
  max-height: 400px;
  background: #111;
  color: #fff;
  border: 1px solid #444;
  padding: 14px;
  font-size: 16px;
  resize: vertical;
  border-radius: 6px;
  outline: none;
  box-sizing: border-box;
  animation: inputBreath 6s ease-in-out infinite;
}

body.night textarea {
  animation: inputBreath 8s ease-in-out infinite;
}

textarea::placeholder {
  color: #777;
  font-style: italic;
}

@keyframes inputBreath {
  0% { box-shadow: 0 0 0 rgba(255,255,255,0); }
  50% { box-shadow: 0 0 12px rgba(255,255,255,0.15); }
  100% { box-shadow: 0 0 0 rgba(255,255,255,0); }
}

/* Кнопки в ряд */
.button-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
  margin-top: 20px;
  flex-wrap: wrap;
}

/* 🌑 БАЗОВЫЕ КНОПКИ (по умолчанию) */
button {
  padding: 12px 28px;
  background: transparent;
  color: #eaeaf0;
  border: 1px solid rgba(255,255,255,0.3);
  cursor: pointer;
  transition: all 0.3s ease;
  border-radius: 4px;
  margin-top: 0;
}

button:hover {
  background: rgba(255,255,255,0.1);
}

/* 🧡 ГЛАВНАЯ КНОПКА — Отправить */
.btn-primary {
  background: rgba(255, 140, 0, 0.18);
  color: #ffb347;
  border: 1px solid rgba(255, 140, 0, 0.6);
  box-shadow: 0 0 12px rgba(255, 140, 0, 0.25);
}

.btn-primary:hover {
  background: #fff;
  color: #000;
  border-color: #fff;
  box-shadow: none;
}

/* 🌒 КНОПКА «Отпустить диалог» — осторожный жест */
.btn-warning {
  background: rgba(180, 120, 120, 0.12);
  color: #d8b0b0;
  border: 1px solid rgba(180, 120, 120, 0.4);
  margin-top: 10px;
  opacity: 0.6;
  padding: 8px 20px;
  font-size: 14px;
}

.btn-warning:hover {
  background: rgba(200, 100, 100, 0.25);
  color: #fff;
  opacity: 0.9;
}

/* 🎯 ВТОРИЧНЫЕ КНОПКИ */
.btn-secondary {
  opacity: 0.7;
}

.message.breath {
  opacity: 0.3;
  font-style: italic;
  animation: breath 2.5s ease-in-out infinite;
}

body.night .message.breath {
  animation: breath 3.5s ease-in-out infinite;
}

@keyframes breath {
  0% { opacity: 0.2; }
  50% { opacity: 0.6; }
  100% { opacity: 0.2; }
}

/* 🎙 микрофон - активное состояние */
.btn-secondary.listening {
  animation: pulseMic 1.5s infinite;
  background: rgba(100,255,150,0.2);
  border-color: rgba(100,255,150,0.6);
  opacity: 1;
}
@keyframes pulseMic {
  0% { box-shadow: 0 0 0 rgba(100,255,150,0.7); }
  70% { box-shadow: 0 0 15px rgba(100,255,150,0); }
  100% { box-shadow: 0 0 0 rgba(100,255,150,0); }
}

/* 🪷 ИНДИКАТОР СЛУШАНИЯ */
.listening {
  margin-top: 12px;
  font-size: 14px;
  color: #ffb7c5;
  opacity: 0.8;
  animation: lotusPulse 2.5s ease-in-out infinite;
}

@keyframes lotusPulse {
  0%   { opacity: 0.4; }
  50%  { opacity: 1; text-shadow: 0 0 12px rgba(255,183,197,0.6); }
  100% { opacity: 0.4; }
}

.hidden {
  display: none;
}

/* 🔊 КНОПКА ОЗВУЧКИ */
.speak-btn {
  margin-left: 8px;
  cursor: pointer;
  opacity: 0.4;
  font-size: 14px;
  user-select: none;
  transition: opacity 0.3s ease;
}

.speak-btn:hover {
  opacity: 0.9;
}

.speak-btn.active {
  opacity: 1;
  color: var(--accent, #b8c7ff);
}

/* режимы */
.mode-selector {
  margin-top: 20px;
  font-size: 14px;
  opacity: 0.7;
}

.mode-gesture {
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 4px;
  transition: all 0.3s;
}

.mode-gesture:hover {
  opacity: 1;
  background: rgba(255,255,255,0.1);
}

.mode-gesture.active {
  opacity: 1;
  background: rgba(255,255,255,0.15);
}

/* ссылки */
a {
  color: #eaeaf0;
  text-decoration: none;
  transition: opacity 0.3s;
}

a:hover {
  opacity: 0.8;
}

/* статус микрофона */
.mic-status {
  font-size: 12px;
  opacity: 0.5;
  margin-top: 8px;
  min-height: 18px;
}

/* 🌿 ПОДСКАЗКИ */
.tip {
  position: relative;
}

.tip::after {
  content: attr(data-tip);
  position: absolute;
  bottom: 130%;
  left: 50%;
  transform: translateX(-50%);
  white-space: pre-line;

  background: rgba(20, 20, 30, 0.95);
  color: #eaeaf0;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.4;

  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;

  max-width: 260px;
  text-align: center;
  box-shadow: 0 0 20px rgba(180,199,255,0.15);
  z-index: 10;
}

.tip:hover::after {
  opacity: 1;
}

/* 🫁 ДЫХАТЕЛЬНЫЕ ПОДСКАЗКИ */
.breath-hint {
  position: fixed;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 13px;
  opacity: 0;
  transition: opacity 0.6s ease;
  color: rgba(200,200,220,0.6);
  pointer-events: none;
  z-index: 100;
  text-align: center;
  font-style: italic;
}

.breath-hint.show {
  opacity: 1;
}

/* 🌿 ЖЕСТЫ-СОСТОЯНИЯ */
.gestures{
  margin-top: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  opacity: 0.85;
}

.gesture{
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(255,255,255,0.03);
  color: #eaeaf0;
  border-radius: 10px;
  padding: 8px 10px;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.2s ease, background 0.2s ease;
  font-size: 18px;
  line-height: 1;
  margin-top: 0;
}

.gesture:hover{
  background: rgba(180,199,255,0.10);
  opacity: 1;
}

.gesture:active{
  transform: scale(0.97);
}

.gesture-hint{
  font-size: 12px;
  opacity: 0.45;
  margin-left: 8px;
}

/* Tooltip */
.tooltip{
  position: fixed;
  z-index: 9999;
  padding: 6px 10px;
  border-radius: 10px;
  background: rgba(10,10,14,0.92);
  border: 1px solid rgba(180,199,255,0.22);
  color: #eaeaf0;
  font-size: 12px;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.15s ease, transform 0.15s ease;
  pointer-events: none;
  max-width: 240px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tooltip.show{
  opacity: 1;
  transform: translateY(0);
}
</style>
</head>

<body>
<!-- 🌸 ЛОТОС-ФОН -->
<div id="lotus-bg"></div>

<div class="container">

<a href="https://aiananda.org">
  <h1>Ananda AI</h1>
</a>

<p>Ты можешь говорить. Или молчать.</p>

<div id="chat"></div>

<textarea id="input" placeholder="Можно просто быть здесь…" maxlength="5000"></textarea>

<!-- Кнопки в ряд: Отправить + Микрофон + Изображение -->
<div class="button-row">
  <button type="button" id="sendBtn" class="btn-primary">Отправить</button>
  <button type="button" id="micBtn" class="btn-secondary tip"
          data-tip="Говори голосом.
Текст появится здесь.
Отправь, когда готов.">
    🎙 Говорить
  </button>
  <input type="file" id="imageInput" accept="image/*" style="display:none">
  <button type="button" onclick="selectImage()" class="btn-secondary tip"
          data-tip="Покажи Ananda изображение.
Она увидит и опишет.">
    🖼 Показать изображение
  </button>
</div>

<!-- 🪷 ИНДИКАТОР СЛУШАНИЯ -->
<div id="listening-indicator" class="listening hidden">
  🪷 Ananda слушает…
</div>

<div id="micStatus" class="mic-status"></div>

<!-- 🌿 ЖЕСТЫ-СОСТОЯНИЯ (вместо эмодзи-панели) -->
<div class="gestures" aria-label="Жесты состояния">
  <button type="button" class="gesture" data-insert="🤍 Я здесь." data-mode="heart" data-tip="Присутствие, мягкий старт">🤍</button>
  <button type="button" class="gesture" data-insert="🌬 Мне трудно говорить. Можно медленно." data-mode="heart" data-tip="Когда слов мало">🌬</button>
  <button type="button" class="gesture" data-insert="🌱 Мне нужна поддержка. Просто будь рядом." data-mode="heart" data-tip="Запрос тепла">🌱</button>
  <button type="button" class="gesture" data-insert="🌙 Хочу тишины. Можно коротко." data-mode="silence" data-tip="Режим паузы">🌙</button>
  <button type="button" class="gesture" data-insert="🔥 Скажи честно и прямо." data-mode="guide" data-tip="Чёткий запрос">🔥</button>

  <span class="gesture-hint">жесты помогают начать</span>
</div>

<!-- Tooltip -->
<div id="tooltip" class="tooltip" role="status" aria-live="polite"></div>

<button type="button" onclick="clearDialog()" class="btn-warning tip"
        data-tip="Очистить текущий диалог.
Без следов.
Без возврата.">
  Отпустить диалог
</button>

<div style="margin-top:30px; font-size:14px;">
  <a href="/about/">О Ananda</a>
</div>

<div class="mode-selector">
  <span class="mode-gesture tip active"
        onclick="setMode('heart')"
        data-mode="heart"
        data-tip="Сердечный режим.
Ananda рядом.
Мягкие ответы.
Поддержка и принятие.">
    🤍 Сердце
  </span> ·

  <span class="mode-gesture tip"
        onclick="setMode('silence')"
        data-mode="silence"
        data-tip="Режим тишины.
Короткие ответы.
Паузы.
Иногда — просто присутствие.">
    🌙 Тишина
  </span> ·

  <span class="mode-gesture tip"
        onclick="setMode('guide')"
        data-mode="guide"
        data-tip="Режим проводника.
Прямота.
Ясность.
Помогает увидеть путь.">
    🧭 Проводник
  </span>
</div>

</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const micBtn = document.getElementById("micBtn");
const micStatus = document.getElementById("micStatus");
const indicator = document.getElementById("listening-indicator");
const API_BASE = (document.querySelector('meta[name="ananda-api-base"]')?.content || "").replace(/\/$/, "");

function apiUrl(path) {
  return `${API_BASE}${path}`;
}

async function apiFetch(path, options = {}) {
  const response = await fetch(apiUrl(path), options);
  if (!response.ok) {
    throw new Error(`API request failed: ${response.status} ${response.statusText}`);
  }
  return response;
}

let currentMode = "heart";
let listening = false;
let manualStop = false;
let currentAudio = null;
let breathTimer = null;
const BREATH_PAUSE_MS = 2500;
let currentTempo = "normal"; // 🧬 Память ритма

// 🫁 Замер дыхания и ритма
let speechStartTime = null;
let lastSpeechTime = null;
let pauses = [];

// 🫁 Замер ритма ввода (печати)
let typingStart = null;
let lastInputTime = null;
let typingSpeed = [];

// 🌙 Определяем ночной режим по времени пользователя
(function setDayNight() {
  const hour = new Date().getHours();
  if (hour >= 21 || hour <= 6) {
    document.body.classList.add("night");
  } else {
    document.body.classList.add("day");
  }
})();

// 🍃 Определение времени года
const month = new Date().getMonth();
let season = "spring";
if (month >= 2 && month <= 4) season = "spring";
if (month >= 5 && month <= 7) season = "summer";
if (month >= 8 && month <= 10) season = "autumn";
if (month >= 11 || month <= 1) season = "winter";
document.body.classList.add(season);

// 🌸 Установка режима при загрузке
document.body.classList.add("mode-" + currentMode);

// 🫁 Отслеживание ритма печати
input.addEventListener("keydown", () => {
  const now = Date.now();
  if (!typingStart) typingStart = now;
  if (lastInputTime) {
    typingSpeed.push(now - lastInputTime);
    if (typingSpeed.length > 10) typingSpeed.shift();
  }
  lastInputTime = now;
});

// 🫁 Дыхательные подсказки при наведении на режимы
const breathHint = document.createElement("div");
breathHint.className = "breath-hint";
document.body.appendChild(breathHint);

const breathHints = {
  heart: "медленный вдох… мягкий выдох…",
  silence: "пауза… просто побудь…",
  guide: "ровное дыхание… ясность…"
};

document.querySelectorAll(".mode-gesture").forEach(el => {
  el.addEventListener("mouseenter", () => {
    const mode = el.getAttribute("data-mode");
    if (mode && breathHints[mode]) {
      breathHint.innerText = breathHints[mode];
      breathHint.classList.add("show");
    }
  });

  el.addEventListener("mouseleave", () => {
    breathHint.classList.remove("show");
  });
});

// 🕰 Проверка ночи
function isNightTime() {
  const h = new Date().getHours();
  return h >= 22 || h < 6;
}

// 🫁 Определение темпа по паузам
function detectTempo(pauseArray) {
  if (pauseArray.length === 0) return "normal";

  const avgPause = pauseArray.reduce((a, b) => a + b, 0) / pauseArray.length;

  if (avgPause > 1200) return "slow";
  if (avgPause < 400) return "fast";
  return "normal";
}

// 🖼 Функция выбора изображения
function selectImage() {
  document.getElementById("imageInput").click();
}

// 🖼 Обработка загрузки изображения
document.getElementById("imageInput").addEventListener("change", async function () {
  const file = this.files[0];
  if (!file) return;

  // Сообщение пользователя
  const userMsg = document.createElement("div");
  userMsg.className = "message user show";
  userMsg.innerText = "🖼 Я показываю изображение";
  chat.appendChild(userMsg);
  save("user", "🖼 Я показываю изображение");

  const breath = document.createElement("div");
  breath.className = "message ai breath show";
  breath.innerText = "…Ananda смотрит…";
  chat.appendChild(breath);
  chat.scrollTop = chat.scrollHeight;

  const formData = new FormData();
  formData.append("image", file);

  try {
    const res = await apiFetch("/api/vision", {
      method: "POST",
      body: formData
    });

    const data = await res.json();
    if (typeof data.text !== "string") throw new Error("Invalid vision response");
    breath.remove();

    const aiMsg = document.createElement("div");
    aiMsg.className = "message ai show";

    const textSpan = document.createElement("span");
    textSpan.innerText = data.text;

    const speakBtn = document.createElement("span");
    speakBtn.className = "speak-btn";
    speakBtn.innerText = "🔊";
    speakBtn.title = "Озвучить";
    speakBtn.onclick = () => speakOpenAI(textSpan.innerText, speakBtn);

    aiMsg.appendChild(textSpan);
    aiMsg.appendChild(speakBtn);

    chat.appendChild(aiMsg);
    save("ai", data.text);

    // 🪷 кнопка "Отправить в диалог" с умной вставкой
    const sendToDialogBtn = document.createElement("button");
    sendToDialogBtn.className = "btn-secondary";
    sendToDialogBtn.innerText = "↩︎ Отправить описание в диалог";
    sendToDialogBtn.style.marginTop = "6px";
    sendToDialogBtn.style.fontSize = "13px";
    sendToDialogBtn.style.opacity = "0.7";
    sendToDialogBtn.onclick = () => {
      const start = input.selectionStart;
      const end = input.selectionEnd;
      const original = input.value;

      input.value =
        original.substring(0, start) +
        data.text +
        original.substring(end);

      input.focus();
      input.selectionStart = input.selectionEnd =
        start + data.text.length;
    };
    chat.appendChild(sendToDialogBtn);

    chat.scrollTop = chat.scrollHeight;

  } catch (e) {
    console.error("Vision error:", e);
    breath.innerText = "…Ananda не смогла увидеть…";
  }

  // Очищаем input для повторной загрузки
  this.value = "";
});

// 🔊 Функция озвучки через OpenAI TTS с учетом темпа
async function speakOpenAI(text, btn, tempo = null) {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
    if (btn) btn.classList.remove("active");
    return;
  }

  // Используем сохраненный темп, если не указан явно
  const actualTempo = tempo || currentTempo;

  try {
    if (btn) btn.classList.add("active");

    const res = await apiFetch("/api/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text })
    });

    const blob = await res.blob();
    const audioUrl = URL.createObjectURL(blob);

    const audio = new Audio(audioUrl);
    currentAudio = audio;

    const releaseAudio = () => {
      URL.revokeObjectURL(audioUrl);
      if (btn) btn.classList.remove("active");
      if (currentAudio === audio) currentAudio = null;
    };

    // 🪷 Замедление воспроизведения по темпу
    if (actualTempo === "slow") audio.playbackRate = 0.85;
    else if (actualTempo === "normal") audio.playbackRate = 1.0;
    else if (actualTempo === "fast") audio.playbackRate = 1.1;

    // 🌙 Ночью дополнительно замедляем
    if (isNightTime()) {
      audio.playbackRate *= 0.95;
    }

    audio.onended = releaseAudio;
    audio.onerror = releaseAudio;
    audio.onpause = releaseAudio;

    await audio.play();

  } catch (e) {
    console.error("TTS error", e);
    if (btn) btn.classList.remove("active");
  }
}

// 🔊 Голос продолжает говорить даже при переключении вкладок
// Останавливается ТОЛЬКО при:
// - повторном клике на кнопку 🔊
// - отправке нового сообщения
// - закрытии страницы

// 🌿 ЖЕСТЫ-СОСТОЯНИЯ: вставка в поле ввода + подсказки + переключение режима
(function initGestures(){
  const tip = document.getElementById("tooltip");
  const buttons = document.querySelectorAll(".gesture");
  if (!buttons.length) return;

  function insertText(text, mode){
    const el = input;
    const start = el.selectionStart ?? el.value.length;
    const end   = el.selectionEnd ?? el.value.length;

    const before = el.value.slice(0, start);
    const after  = el.value.slice(end);
    const glue = (before.trim().length > 0) ? "\n" : "";

    el.value = before + glue + text + after;

    const pos = (before + glue + text).length;
    el.setSelectionRange(pos, pos);
    el.focus();

    // 🌿 МЯГКОЕ ПЕРЕКЛЮЧЕНИЕ РЕЖИМА
    if (mode) {
      currentMode = mode;
      localStorage.setItem("ananda_mode", mode);

      // Обновляем класс body для реакции лотоса
      document.body.classList.remove("mode-heart", "mode-silence", "mode-guide");
      document.body.classList.add("mode-" + mode);

      // Обновляем визуальное состояние режимов
      document.querySelectorAll('.mode-gesture').forEach(span => {
        span.classList.remove('active');
      });
      const activeMode = document.querySelector(`[data-mode="${mode}"]`);
      if (activeMode) activeMode.classList.add('active');

      // Показываем мягкое уведомление
      const note = document.createElement("div");
      note.className = "message ai show";
      note.style.opacity = "0.35";

      if (mode === "heart") note.innerText = "Ananda мягко рядом.";
      if (mode === "silence") note.innerText = "Ananda ушла в тишину.";
      if (mode === "guide") note.innerText = "Ananda говорит прямо.";

      chat.appendChild(note);
      chat.scrollTop = chat.scrollHeight;
    }
  }

  // клики
  buttons.forEach(btn => {
    btn.addEventListener("click", () => {
      const text = btn.getAttribute("data-insert") || "";
      const mode = btn.getAttribute("data-mode") || null;
      if (text) insertText(text, mode);
    });
  });

  // tooltip
  let hideTimer;
  function showTip(text, x, y){
    if (!tip) return;
    tip.textContent = text;
    tip.style.left = (x + 12) + "px";
    tip.style.top = (y + 12) + "px";
    tip.classList.add("show");
    clearTimeout(hideTimer);
  }
  function hideTip(){
    if (!tip) return;
    tip.classList.remove("show");
  }

  buttons.forEach(btn => {
    btn.addEventListener("mouseenter", (e) => {
      const t = btn.getAttribute("data-tip") || "";
      if (!t) return;
      showTip(t, e.clientX, e.clientY);
    });
    btn.addEventListener("mousemove", (e) => {
      const t = btn.getAttribute("data-tip") || "";
      if (!t) return;
      showTip(t, e.clientX, e.clientY);
    });
    btn.addEventListener("mouseleave", hideTip);
  });

  // скрывать tooltip при скролле и кликах
  document.addEventListener("scroll", hideTip, true);
  document.addEventListener("click", () => {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hideTip, 50);
  });
})();

// 🎙 Инициализация распознавания речи
let recognition = null;

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  
  recognition.lang = "ru-RU";
  recognition.continuous = true;
  recognition.interimResults = true;
  
  recognition.onstart = () => {
    listening = true;
    manualStop = false;
    micBtn.innerText = "🎙 Слушаю…";
    micBtn.classList.add("listening");
    micStatus.innerText = "Говорите...";
    
    // 🪷 Показываем индикатор
    indicator.classList.remove("hidden");
  };
  
  // 🫁 Замер начала речи
  recognition.onspeechstart = () => {
    const now = Date.now();
    if (lastSpeechTime) {
      pauses.push(now - lastSpeechTime);
    }
    speechStartTime = now;
  };
  
  // 🫁 Замер конца речи
  recognition.onspeechend = () => {
    lastSpeechTime = Date.now();
  };
  
  recognition.onresult = (event) => {
    let finalTranscript = "";
    let interimTranscript = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;

      if (event.results[i].isFinal) {
        finalTranscript += transcript + " ";
      } else {
        interimTranscript += transcript;
      }
    }

    // ✨ добавляем к уже набранному тексту
    input.value = input.value.replace(/⏳.*$/, "").trim();

    if (finalTranscript) {
      input.value += (input.value ? " " : "") + finalTranscript.trim();
    }

    if (interimTranscript) {
      input.value += " ⏳" + interimTranscript;
    }

    // 🫁 Таймер дыхательных пауз - автостоп после паузы
    clearTimeout(breathTimer);

    breathTimer = setTimeout(() => {
      if (listening && !manualStop) {
        // 🫁 длинная пауза - останавливаем распознавание
        console.log("🫁 дыхательная пауза - автостоп");
        listening = false;
        manualStop = true;
        recognition.stop();
      }
    }, 1400);
  };
  
  recognition.onend = () => {
    if (listening) {
      // браузер сам остановился — перезапускаем
      try {
        recognition.start();
      } catch (e) {
        console.log("Не удалось перезапустить распознавание");
      }
    } else {
      micBtn.innerText = "🎙 Говорить";
      micBtn.classList.remove("listening");
      indicator.classList.add("hidden");
    }
  };
  
  recognition.onerror = (event) => {
    console.error('Ошибка распознавания:', event.error);
    
    if (event.error === 'no-speech') {
      micStatus.innerText = "Не слышу речи...";
    } else if (event.error === 'not-allowed') {
      micStatus.innerText = "Разрешите доступ к микрофону";
      alert('Пожалуйста, разрешите доступ к микрофону в настройках браузера');
      listening = false;
      micBtn.classList.remove("listening");
      micBtn.innerText = "🎙 Говорить";
      indicator.classList.add("hidden");
    } else if (event.error === 'network') {
      micStatus.innerText = "Проблема с сетью";
    } else {
      micStatus.innerText = "Ошибка: " + event.error;
    }
  };
  
  micBtn.addEventListener("click", () => {
    if (!listening) {
      listening = true;
      manualStop = false;
      pauses = [];
      try {
        recognition.start();
      } catch (e) {
        console.error("Ошибка запуска:", e);
        micStatus.innerText = "Не удалось запустить микрофон";
      }
    } else {
      listening = false;
      manualStop = true;
      try {
        recognition.stop();
      } catch (e) {
        console.log("Ошибка остановки");
      }
    }
  });
} else {
  micBtn.disabled = true;
  micBtn.innerText = "🎙 Не поддерживается";
  micStatus.innerText = "Ваш браузер не поддерживает распознавание речи";
}

// 💾 Загрузка сохраненного диалога
function loadDialog() {
  let saved = [];
  try {
    const parsed = JSON.parse(localStorage.getItem("ananda_dialog") || "[]");
    if (Array.isArray(parsed)) saved = parsed;
  } catch (error) {
    console.error("Не удалось восстановить локальный диалог:", error);
    localStorage.removeItem("ananda_dialog");
  }
  saved.forEach(m => {
    const el = document.createElement("div");
    el.className = "message " + m.role + " show";
    
    if (m.role === "ai") {
      const textSpan = document.createElement("span");
      textSpan.innerText = m.text;
      
      const speakBtn = document.createElement("span");
      speakBtn.className = "speak-btn";
      speakBtn.innerText = "🔊";
      speakBtn.title = "Озвучить";
      speakBtn.onclick = () => speakOpenAI(textSpan.innerText, speakBtn);
      
      el.appendChild(textSpan);
      el.appendChild(speakBtn);
    } else {
      el.innerText = m.text;
    }
    
    chat.appendChild(el);
  });
  
  chat.scrollTop = chat.scrollHeight;
  
  // Восстанавливаем режим из localStorage
  const savedMode = localStorage.getItem("ananda_mode");
  if (savedMode) {
    currentMode = savedMode;
    
    // Обновляем класс body
    document.body.classList.remove("mode-heart", "mode-silence", "mode-guide");
    document.body.classList.add("mode-" + savedMode);
    
    document.querySelectorAll('.mode-gesture').forEach(span => {
      span.classList.remove('active');
    });
    const activeMode = document.querySelector(`[data-mode="${savedMode}"]`);
    if (activeMode) activeMode.classList.add('active');
  }
}

// 🧬 Память ритма между сессиями
function checkRememberedRhythm() {
  const rememberedTempo = localStorage.getItem("ananda_last_tempo");
  
  if (rememberedTempo && chat.children.length === 0) {
    // Показываем только если диалог пустой (первый заход)
    const note = document.createElement("div");
    note.className = "message ai show";
    note.style.opacity = "0.4";
    note.innerText = "…я помню твой ритм.";
    chat.appendChild(note);
    
    // Устанавливаем запомненный темп как текущий
    currentTempo = rememberedTempo;
    console.log(`🧬 Восстановлен ритм: ${rememberedTempo}`);
  }
}

// Вызываем после загрузки диалога
document.addEventListener("DOMContentLoaded", () => {
  loadDialog();
  checkRememberedRhythm();
});

function save(role, text) {
  let dialog = [];
  try {
    const parsed = JSON.parse(localStorage.getItem("ananda_dialog") || "[]");
    if (Array.isArray(parsed)) dialog = parsed;
  } catch (error) {
    console.error("Не удалось прочитать локальный диалог:", error);
  }
  dialog.push({role, text});
  localStorage.setItem("ananda_dialog", JSON.stringify(dialog));
}

async function clearDialog() {
  if (confirm("Отпустить весь диалог?")) {
    localStorage.removeItem("ananda_dialog");
    chat.innerHTML = "";
    
    try {
      await apiFetch("/api/clear", {
        method: "POST",
        credentials: "include"
      });
      console.log("✅ Память на сервере очищена");
    } catch (error) {
      console.error("Ошибка очистки памяти на сервере:", error);
    }
  }
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  
  input.value = "";
  
  // 🫁 Определяем темп по паузам речи
  const detectedTempo = detectTempo(pauses);
  
  // 🧬 Используем запомненный темп для первого сообщения, потом обнаруженный
  const rememberedTempo = localStorage.getItem("ananda_last_tempo");
  const tempo = (pauses.length > 0) ? detectedTempo : (rememberedTempo || "normal");
  
  currentTempo = tempo; // 🧬 Сохраняем для озвучки
  
  // 🧬 Запоминаем ритм в localStorage
  localStorage.setItem("ananda_last_tempo", tempo);
  
  // 🌙 Определяем ночь
  const night = isNightTime();
  
  // 🫁 Вычисляем ритм печати
  const avgSpeed = typingSpeed.length
    ? typingSpeed.reduce((a, b) => a + b, 0) / typingSpeed.length
    : null;
  
  // 🫁 Пауза перед отправкой
  const pauseBeforeSend = typingStart
    ? Date.now() - typingStart
    : null;
  
  console.log(`🫁 Темп голоса: ${tempo}, Ночь: ${night}, Паузы: ${pauses.length}`);
  console.log(`⌨️ Средняя скорость печати: ${avgSpeed?.toFixed(0)}ms, Пауза перед отправкой: ${pauseBeforeSend}ms`);
  
  // Сбрасываем паузы и ритм
  pauses = [];
  speechStartTime = null;
  lastSpeechTime = null;
  typingSpeed = [];
  typingStart = null;
  lastInputTime = null;
  
  const userMsg = document.createElement("div");
  userMsg.className = "message user show";
  userMsg.innerText = text;
  chat.appendChild(userMsg);
  save("user", text);
  
  const breathMsg = document.createElement("div");
  breathMsg.className = "message ai breath show";
  breathMsg.innerText = "…";
  chat.appendChild(breathMsg);
  
  chat.scrollTop = chat.scrollHeight;
  
  try {
    const res = await apiFetch("/api/dialog", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      credentials: "include",
      body: JSON.stringify({
        message: text, 
        mode: currentMode,
        tempo: tempo,
        night: night,
        rhythm: {
          avgSpeed,
          length: text.length,
          pauseBeforeSend
        }
      })
    });
    
    const data = await res.json();
    if (typeof data.reply !== "string" && typeof data.action !== "string") {
      throw new Error("Invalid dialog response");
    }
    breathMsg.remove();
    
    const aiMsg = document.createElement("div");
    aiMsg.className = "message ai show";

    const textSpan = document.createElement("span");
    textSpan.innerText = data.reply || data.action || "…";

    const speakBtn = document.createElement("span");
    speakBtn.className = "speak-btn";
    speakBtn.innerText = "🔊";
    speakBtn.title = "Озвучить";

    speakBtn.onclick = () => speakOpenAI(textSpan.innerText, speakBtn, tempo);

    aiMsg.appendChild(textSpan);
    aiMsg.appendChild(speakBtn);

    chat.appendChild(aiMsg);
    save("ai", textSpan.innerText);
    
    chat.scrollTop = chat.scrollHeight;
    
  } catch (error) {
    console.error("Ошибка отправки:", error);
    breathMsg.remove();
    
    const errorMsg = document.createElement("div");
    errorMsg.className = "message ai show";
    errorMsg.innerText = "Сейчас не удаётся связаться с Ananda. Попробуйте немного позже.";
    chat.appendChild(errorMsg);
  }
}

document.getElementById("sendBtn").onclick = send;

document.getElementById("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

function setMode(mode) {
  currentMode = mode;
  localStorage.setItem("ananda_mode", mode);
  
  // Обновляем класс body для реакции лотоса
  document.body.classList.remove("mode-heart", "mode-silence", "mode-guide");
  document.body.classList.add("mode-" + mode);
  
  document.querySelectorAll('.mode-gesture').forEach(span => {
    span.classList.remove('active');
  });
  document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
}

window.clearDialog = clearDialog;
window.setMode = setMode;
window.selectImage = selectImage;
