<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Ananda AI — Режимы</title>
  <style>
    body { background:#0e0e11; color:#eaeaf0; font-family:system-ui,sans-serif; margin:0; }
    .wrap { max-width:760px; margin:0 auto; padding:56px 22px; }
    h1 { font-weight:300; letter-spacing:.12em; margin:0 0 22px; }
    .card { border:1px solid rgba(255,255,255,.10); border-radius:12px; padding:18px 18px; margin:12px 0; }
    .title { font-size:16px; letter-spacing:.08em; opacity:.92; margin:0 0 8px; }
    p { opacity:.80; line-height:1.75; font-size:15px; margin:0; }
    a { color:#eaeaf0; text-decoration:none; opacity:.7; }
    a:hover { opacity:1; }
    .small { font-size:14px; opacity:.6; margin-top:22px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Ananda AI</h1>

    <div class="card">
      <div class="title">HEART</div>
      <p>Мягкое присутствие.<br>
         Когда важно, чтобы тебя приняли, а не исправляли.</p>
    </div>

    <div class="card">
      <div class="title">SILENCE</div>
      <p>Краткие ответы или пауза.<br>
         Когда слова уже сказаны.</p>
    </div>

    <div class="card">
      <div class="title">GUIDE</div>
      <p>Прямой, ясный разговор без мистификации.<br>
         Когда нужен ориентир.</p>
    </div>

    <p class="small">
      <a href="/">← назад в диалог</a>
    </p>
  </div>
</body>
</html>
